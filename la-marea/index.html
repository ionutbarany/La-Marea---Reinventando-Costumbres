<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Marea - Reinventando Costumbres</title>
  <meta name="description" content="Carta de La Marea">
  <meta name="theme-color" content="#04264e">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p id="carta-status" class="carta-status" hidden role="status"></p>
  <div class="app">

    <!-- VISTA 1: inicio (cabecera + lista de secciones) -->
    <div id="view-home">
      <header class="header">
        <div class="header__row">
          <button type="button" id="lang-toggle" class="lang-toggle">EN</button>
          <h1 class="header__logo">
            <img src="img/logo.png" width="1000" height="394"
                 alt="La Marea - Reinventando Costumbres">
          </h1>
        </div>
      </header>

      <nav id="nav-secciones" aria-label="Secciones de la carta">
        <ul id="section-list" class="section-list"></ul>
      </nav>

      <div class="home-actions">
        <a href="#info" class="home-action" id="home-info-link">
          <span class="home-action__icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
              <path d="M12 10v6M12 7.5v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="home-action__label" id="home-info-label">Sobre nosotros</span>
        </a>
        <a class="home-action" id="review-link" href="#" target="_blank" rel="noopener noreferrer">
          <span class="home-action__icon home-action__icon--star" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/>
            </svg>
          </span>
          <span class="home-action__label" id="home-review-label">Déjanos una reseña</span>
        </a>
      </div>
    </div>

    <!-- VISTA: información del local -->
    <div id="view-info" hidden>
      <div class="topbar">
        <a href="#" class="topbar__back topbar__back--info" aria-label="Volver a la carta">&larr;</a>
        <h2 id="info-title" class="topbar__title">Información</h2>
      </div>

      <div class="info-page">
        <section class="info-card" aria-labelledby="info-heading-horario">
          <h3 id="info-heading-horario" class="info-card__title">
            <span class="info-card__title-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
                <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
              </svg>
            </span>
            <span id="info-label-horario">Horario</span>
          </h3>
          <ul id="info-horario-list" class="info-rows"></ul>
        </section>

        <section class="info-card" aria-labelledby="info-heading-donde">
          <h3 id="info-heading-donde" class="info-card__title">
            <span class="info-card__title-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21s7-4.5 7-11a7 7 0 1 0-14 0c0 6.5 7 11 7 11z" stroke="currentColor" stroke-width="1.75"/>
                <circle cx="12" cy="10" r="2.25" stroke="currentColor" stroke-width="1.75"/>
              </svg>
            </span>
            <span id="info-label-donde">Dónde estamos</span>
          </h3>
          <p id="info-address-line1" class="info-address"></p>
          <p id="info-address-line2" class="info-address"></p>
          <a id="info-maps-btn" class="info-btn" href="#" target="_blank" rel="noopener noreferrer"></a>
        </section>

        <section class="info-card" aria-labelledby="info-heading-telefono">
          <h3 id="info-heading-telefono" class="info-card__title">
            <span class="info-card__title-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6.5 4h3l1.5 5-2 1.5a11 11 0 0 0 5 5L15.5 14l5 1.5v3a1.5 1.5 0 0 1-1.6 1.5A15 15 0 0 1 3 6.1 1.5 1.5 0 0 1 4.5 4.5V4z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
              </svg>
            </span>
            <span id="info-label-telefono">Teléfono</span>
          </h3>
          <a id="info-phone-link" class="info-row info-row--link" href="#">
            <span id="info-phone-text"></span>
            <span class="info-row__chevron" aria-hidden="true"></span>
          </a>
        </section>

        <section class="info-card" aria-labelledby="info-heading-redes">
          <h3 id="info-heading-redes" class="info-card__title info-card__title--plain">
            <span id="info-label-redes">Redes sociales</span>
          </h3>
          <ul id="info-social-list" class="info-social"></ul>
        </section>
      </div>
    </div>

    <!-- VISTA 2: una sección con sus platos -->
    <div id="view-section" hidden>
      <div class="topbar">
        <a href="#" class="topbar__back" aria-label="Volver a la carta">&larr;</a>
        <h2 id="section-title" class="topbar__title"></h2>
      </div>

      <p id="section-note" class="section-note" hidden></p>
      <ul id="dish-list" class="dish-list"></ul>
      <p id="section-empty" class="section-empty" hidden></p>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="menu-data.js"></script>
  <script src="info-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
